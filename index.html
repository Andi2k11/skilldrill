<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skilldrill</title>
    <!-- Bootstrap 5 (CSS with SRI) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Site stylesheet (cache-busted automatically) -->
    <link id="site-css" rel="stylesheet" href="/assets/css/style.css">
    
  </head>
  <body>
    <div class="d-flex align-items-center justify-content-center min-vh-100">
      <div class="card device-card shadow">
        <div class="card-header text-center">
          <h5 class="mb-0">Kortets header</h5>
        </div>
        <div class="card-body d-flex flex-column">
          <div class="card question-card">
            <div class="card-body h-100 d-flex flex-column">
              <p class="card-title text-center question-title fw-semibold fs-1">Frågetexten visas här</p>
              <p class="card-text text-center question-text fs-3">Här visas själva uppgiften</p>
            </div>
          </div>
          
            <div class="d-flex gap-3 mt-3 sub-cards">
                <div class="card sub-card-left answer-card">
                    <div class="card-body">
                        <p class="card-text mb-0">Svar:</p>
                        <input id="answer-input" class="form-control mt-3" type="text" aria-label="Answer input">
                    </div>
                </div>
                <div class="card sub-card-right input-card">
                  <div class="card-body">
                    <div class="calc-grid" aria-label="Calculator input control">
                      <button type="button" class="btn btn-light btn-paren">(</button>
                      <button type="button" class="btn btn-light btn-paren">)</button>
                      <button type="button" class="btn btn-light">^</button>
                      <button type="button" class="btn btn-light">√</button>

                      <button type="button" class="btn btn-light">9</button>
                      <button type="button" class="btn btn-light">8</button>
                      <button type="button" class="btn btn-light">7</button>
                      <button type="button" class="btn btn-light btn-op">*</button>

                      <button type="button" class="btn btn-light">6</button>
                      <button type="button" class="btn btn-light">5</button>
                      <button type="button" class="btn btn-light">4</button>
                      <button type="button" class="btn btn-light btn-op">/</button>

                      <button type="button" class="btn btn-light">1</button>
                      <button type="button" class="btn btn-light">2</button>
                      <button type="button" class="btn btn-light">1</button>
                      <button type="button" class="btn btn-light btn-op">-</button>

                      <button type="button" class="btn btn-light">0</button>
                      <button type="button" class="btn btn-light">,</button>
                      <button type="button" class="btn btn-secondary">⌫</button>
                      <button type="button" class="btn btn-light btn-op">+</button>

                      <button type="button" class="btn btn-secondary">&lt;</button>
                      <button type="button" class="btn btn-secondary">&gt;</button>
                      <button type="button" class="btn btn-danger">C</button>
                      <button type="button" class="btn btn-primary">Svar</button>
                    </div>
                    
                  </div>
                </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap bundle with Popper (with SRI) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/assets/js/cachebust.js"></script>
    <script src="/assets/js/number-input-control.js"></script>
    <script src="/assets/js/app.js"></script>
  </body>
</html>
