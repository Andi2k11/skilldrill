<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skilldrill</title>
    <!-- Bootstrap 5 (CSS with SRI) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Site stylesheet (cache-busted automatically) -->
    <link id="site-css" rel="stylesheet" href="/assets/css/style.css">
    <script>
      (function(){
        try{
          var link = document.getElementById('site-css');
          if(!link) return;
          var url = new URL(link.href, location.origin);
          // Use a short timestamp (minute resolution) to avoid excessive cache misses
          var ts = new Date();
          var ver = ts.getFullYear().toString() + ('0'+(ts.getMonth()+1)).slice(-2) + ('0'+ts.getDate()).slice(-2) + 'T' + ('0'+ts.getHours()).slice(-2) + ('0'+ts.getMinutes()).slice(-2);
          url.searchParams.set('v', ver);
          link.href = url.toString();
        }catch(e){console && console.warn && console.warn('cache-buster failed', e);} 
      })();
    </script>
  </head>
  <body>
    <div class="d-flex align-items-center justify-content-center min-vh-100">
      <div class="card device-card shadow">
        <div class="card-header text-center">
          <h5 class="mb-0">Kortets header</h5>
        </div>
        <div class="card-body d-flex flex-column">
          <div class="card mt-3 question-card">
            <div class="card-body h-100 d-flex flex-column">
              <h6 class="card-title">Question-card</h6>
              <p class="card-text">Detta är frågekortet som tar 40% av huvudkortets höjd.</p>
            </div>
          </div>
          
          <div class="d-flex gap-3 mt-3 sub-cards">
            <div class="card sub-card-left">
              <div class="card-body">
                <h6 class="card-title">Vänster kort</h6>
                <p class="card-text">Tar 60% av bredden.</p>
              </div>
            </div>
            <div class="card sub-card-right">
              <div class="card-body">
                <h6 class="card-title">Höger kort</h6>
                <p class="card-text">Tar 40% av bredden.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap bundle with Popper (with SRI) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
